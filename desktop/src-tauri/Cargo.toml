[package]
name = "calsync-desktop"
version = "0.1.0"
description = "CalSync for Windows and Mac: the engine and the setup page in an app window, with a tray icon"
authors = ["CalSync"]
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "calsync_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
